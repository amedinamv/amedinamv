<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Andres Medina - portfolio</title>
  <desc id="desc">ME brand banner: warm paper, giant AMV mark, dirt-road accent path.</desc>
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.045  0 0 0 0.28 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="#F5F4F0"/>
  <rect width="1280" height="480" fill="#F5F4F0" filter="url(#grain)" opacity="0.85"/>

  <!-- margin ticks -->
  <g stroke="#C8C7C1" stroke-width="1.5" opacity="0.5">
    <path d="M48 48 h24 M48 48 v24"/>
    <path d="M1232 48 h-24 M1232 48 v24"/>
    <path d="M48 432 h24 M48 432 v-24"/>
    <path d="M1232 432 h-24 M1232 432 v-24"/>
  </g>

  <!-- giant watermark mark -->
  <text x="640" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="320" font-weight="900" fill="#111110" opacity="0.045" letter-spacing="-0.06em">AMV</text>

  <!-- mono top bar -->
  <text x="80" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B6A65" letter-spacing="0.12em">GITHUB / OVERVIEW</text>
  <text x="1200" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B6A65" letter-spacing="0.1em">CALI ù REMOTE ù SELECT WORK</text>

  <!-- name block -->
  <text x="80" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#111110" letter-spacing="-0.035em">Andres Medina</text>
  <text x="80" y="250" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#6B6A65">Product &amp; UX designer. End-to-end product design and research.</text>

  <!-- accent chip -->
  <rect x="80" y="286" width="168" height="36" rx="4" fill="#D4420A"/>
  <text x="164" y="310" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F4F0" letter-spacing="0.14em">PORTFOLIO</text>

  <text x="268" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6B6A65" letter-spacing="0.06em">andresmv.com  ù  hallway ? room</text>

  <!-- dirt road character - thicker, more swagger -->
  <path d="M -20 400 C 160 360, 280 440, 460 390 S 720 320, 900 380 S 1120 430, 1300 360" fill="none" stroke="#D4420A" stroke-width="18" stroke-linecap="round"/>
  <path d="M -20 408 C 160 368, 280 448, 460 398 S 720 328, 900 388 S 1120 438, 1300 368" fill="none" stroke="#111110" stroke-width="3" stroke-linecap="round" opacity="0.2"/>

  <!-- road "wear" ticks -->
  <g stroke="#F5F4F0" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="220" y1="392" x2="236" y2="386"/>
    <line x1="420" y1="398" x2="438" y2="392"/>
    <line x1="640" y1="348" x2="656" y2="354"/>
    <line x1="860" y1="372" x2="878" y2="368"/>
    <line x1="1040" y1="404" x2="1056" y2="398"/>
  </g>

  <!-- footer wink -->
  <text x="80" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#111110">
    <tspan fill="#D4420A">dirt road &gt; garden path</tspan>
    <tspan fill="#6B6A65">  ù  function first  ù  stay until it's done</tspan>
  </text>
</svg>
